name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ledger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
        working-directory: .
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Type-check domain (strict)
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q -m "not corpus"
