version = 1
revision = 3
requires-python = ">=3.14"

[manifest]
members = [
    "ledger",
    "obol",
    "server",
]

[[package]]
name = "ledger"
version = "0.1.0"
source = { editable = "ledger" }

[[package]]
name = "obol"
version = "0.1.0"
source = { virtual = "." }

[[package]]
name = "server"
version = "0.1.0"
source = { editable = "server" }
dependencies = [
    { name = "ledger" },
]

[package.metadata]
requires-dist = [{ name = "ledger", editable = "ledger" }]
